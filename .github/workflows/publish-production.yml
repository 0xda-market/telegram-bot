              echo "::error::FOUR_X_ERRORS_TOKEN must be single-line." >&2
              exit 1
            }
          fi
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y -qq age
