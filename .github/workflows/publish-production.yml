name: Publish Market Bot production release
run-name: Publish Market Bot production ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-bot-production-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Verify exact-head CI and publish attested production release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/0xda-market/telegram-bot-production
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require latest master with successful push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq '.sha')"
          test "$current" = "$RELEASE_SHA" || {
            echo "::error::Master moved; dispatch this workflow again at its current head." >&2
            exit 1
          }
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$RELEASE_SHA&per_page=30")"
          jq -e --arg sha "$RELEASE_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and .head_branch == "master" and
              .event == "push" and .status == "completed" and
              .conclusion == "success"
            )] | length > 0
          ' <<<"$runs" >/dev/null || {
            echo "::error::No successful push-triggered Full CI for the exact master head." >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Validate isolated production configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
          TRADING_LAB_TOKEN: ${{ secrets.TRADING_LAB_TOKEN }}
          PARTNER_LOOKUP_TOKEN: ${{ secrets.PARTNER_LOOKUP_TOKEN }}
          CHANNEL_ASSERTION_SECRET: ${{ secrets.CHANNEL_ASSERTION_SECRET }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          MARKET_API_URL: ${{ vars.MARKET_API_URL }}
        run: |
          set -Eeuo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET MARKET_API_TOKEN TRADING_LAB_TOKEN PARTNER_LOOKUP_TOKEN CHANNEL_ASSERTION_SECRET TELEGRAM_BOT_USERNAME PUBLIC_URL MARKET_API_URL; do
            value="$(printenv "$name")"
            test -n "$value" || { echo "::error::Missing production configuration $name" >&2; exit 1; }
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
              echo "::error::Invalid multiline production configuration $name" >&2
              exit 1
            }
          done
          for name in PARTNER_LOOKUP_TOKEN CHANNEL_ASSERTION_SECRET; do
            value="${!name}"
            (( ${#value} >= 32 )) || { echo "::error::$name must be at least 32 bytes." >&2; exit 1; }
          done
          test "$PARTNER_LOOKUP_TOKEN" != "$CHANNEL_ASSERTION_SECRET" || { echo "::error::Checkout keys must be distinct." >&2; exit 1; }
          [[ "$TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z0-9_]{5,32}$ ]] || {
            echo "::error::TELEGRAM_BOT_USERNAME must be a username without @." >&2
            exit 1
          }
          test "$TELEGRAM_BOT_USERNAME" = zeroxda_market_bot || {
            echo "::error::Production publication requires @zeroxda_market_bot." >&2
            exit 1
          }
          test "$PUBLIC_URL" = "https://0xda-market.nilx.one/bot" || {
            echo "::error::Production PUBLIC_URL must use /bot, not /bot-test." >&2
            exit 1
          }
          test "$MARKET_API_URL" = "http://market-api-production:1927" || {
            echo "::error::Production bot must use production Core on the private network." >&2
            exit 1
          }
          [[ "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{1,256}$ ]] || {
            echo "::error::Invalid Telegram webhook secret alphabet." >&2
            exit 1
          }
          # A configured username is not proof that the credential belongs to that bot.
          identity="$(curl --fail --silent --show-error --max-time 15 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")"
          jq -e --arg username "$TELEGRAM_BOT_USERNAME" '
            .ok == true and .result.is_bot == true and .result.username == $username
          ' <<<"$identity" >/dev/null || {
            echo "::error::Production Bot API token does not match TELEGRAM_BOT_USERNAME." >&2
            exit 1
          }

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish immutable production image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_SHA }}

      - name: Attest production image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Encrypt production credentials for edge-dev-1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
          TRADING_LAB_TOKEN: ${{ secrets.TRADING_LAB_TOKEN }}
          PARTNER_LOOKUP_TOKEN: ${{ secrets.PARTNER_LOOKUP_TOKEN }}
          CHANNEL_ASSERTION_SECRET: ${{ secrets.CHANNEL_ASSERTION_SECRET }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          MARKET_API_URL: ${{ vars.MARKET_API_URL }}
        run: |
          set -Eeuo pipefail
          umask 077
          contract="$(curl --fail --silent --show-error --location --retry 2 --max-time 20 \
            https://raw.githubusercontent.com/aiaiaiai-org/infra/master/contracts/servers/edge-dev-1.yaml)"
          grep -Fxq '    - market-bot-production' <<<"$contract" || {
            echo "::error::edge-dev-1 does not own market-bot-production." >&2
            exit 1
          }
          recipient="$(sed -n 's/^  encryptionRecipient: //p' <<<"$contract")"
          [[ "$recipient" =~ ^ssh-ed25519\ [A-Za-z0-9+/]{68}$ ]] || {
            echo "::error::No valid production server encryption recipient." >&2
            exit 1
          }
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y -qq age
          mkdir -p "$RUNNER_TEMP/production-envelope"
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET MARKET_API_TOKEN TRADING_LAB_TOKEN PARTNER_LOOKUP_TOKEN CHANNEL_ASSERTION_SECRET TELEGRAM_BOT_USERNAME PUBLIC_URL MARKET_API_URL; do
            printf '%s=%s\n' "$name" "$(printenv "$name")"
          done | age --recipient "$recipient" --output "$RUNNER_TEMP/production-envelope/secrets.age"
          test -s "$RUNNER_TEMP/production-envelope/secrets.age"
          printf 'FROM scratch\nCOPY secrets.age /secrets.age\n' > "$RUNNER_TEMP/production-envelope/Dockerfile"
          echo "ENVELOPE_CONTEXT=$RUNNER_TEMP/production-envelope" >> "$GITHUB_ENV"

      - name: Publish production secret envelope
        id: envelope
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ENVELOPE_CONTEXT }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_SHA }}.secrets

      - name: Attest production secret envelope
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.envelope.outputs.digest }}
          push-to-registry: true

      - name: Record publication
        run: |
          echo "Production release for $RELEASE_SHA is published and attested for infra reconciliation." >> "$GITHUB_STEP_SUMMARY"
