name: Deploy

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub and VPS environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      production_tag:
        description: Production tag (required only for production; ignored for development)
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: vps-bot-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
      WORKFLOW_REF: ${{ github.ref }}
      SELECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
      PRODUCTION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.production_tag || '' }}
      FORCE_ACTIVATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_DEPLOYMENT_PATH: ${{ vars.SSH_DEPLOYMENT_PATH }}
      VPS_RUNTIME_PATH: /opt/0xda-market-runtime

    steps:
      - name: Resolve deployment source
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_ENV" in development|production) ;; *) exit 1 ;; esac

          if [[ "$DEPLOY_ENV" == production ]]; then
            if [[ "${{ github.event_name }}" != workflow_dispatch ]]; then
              echo "::error::Production deployment is manual-only"
              exit 1
            fi
            if [[ "$WORKFLOW_REF" != refs/heads/master ]]; then
              echo "::error::Run the production workflow from master; select the release with Production tag"
              exit 1
            fi
            if [[ -z "$PRODUCTION_TAG" ]]; then
              echo "::error::Production tag is required for production deployment"
              exit 1
            fi
            if ! git check-ref-format "refs/tags/$PRODUCTION_TAG"; then
              echo "::error::Production tag is not a valid Git tag"
              exit 1
            fi
            echo "RELEASE_REF=refs/tags/$PRODUCTION_TAG" >>"$GITHUB_ENV"
          else
            test -n "$SELECTED_RELEASE_SHA"
            echo "RELEASE_REF=$SELECTED_RELEASE_SHA" >>"$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Resolve immutable release
        id: release
        run: |
          release_sha="$(git rev-parse HEAD)"
          echo "sha=$release_sha" >>"$GITHUB_OUTPUT"
          echo "RELEASE_SHA=$release_sha" >>"$GITHUB_ENV"

      - name: Validate deployment configuration
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_ENV" in development|production) ;; *) exit 1 ;; esac
          case "$FORCE_ACTIVATE" in 0|1) ;; *) exit 1 ;; esac
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            test "$DEPLOY_ENV" = development
            test "$FORCE_ACTIVATE" = 0
          fi
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_DEPLOYMENT_PATH SSH_PORT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not configured for the ${DEPLOY_ENV} environment"
              missing=1
            fi
          done
          test "$missing" -eq 0
          test -n "$RELEASE_REF"
          test -n "$RELEASE_SHA"

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >>"$HOME/.ssh/known_hosts"

      - name: Upload release
        run: |
          set -Eeuo pipefail
          archive="/tmp/0xda-market-bot-${DEPLOY_ENV}-${RELEASE_SHA}.tar.gz"
          tar --exclude=.git --exclude='deploy/vps/.env' -czf "$archive" .
          scp -P "$SSH_PORT" "$archive" "$SSH_USER@$SSH_HOST:/tmp/"

      - name: Stage or activate environment
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$SSH_DEPLOYMENT_PATH' RUNTIME_PATH='$VPS_RUNTIME_PATH' DEPLOY_ENV='$DEPLOY_ENV' FORCE_ACTIVATE='$FORCE_ACTIVATE' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          environment_root="$DEPLOY_PATH/environments/$DEPLOY_ENV"
          archive="/tmp/0xda-market-bot-${DEPLOY_ENV}-${RELEASE_SHA}.tar.gz"
          release_dir="$environment_root/releases/$RELEASE_SHA"
          shared_env="$environment_root/shared/.env"
          current_link="$environment_root/current"
          active_environment=""
          previous_release="$(readlink -f "$current_link" 2>/dev/null || true)"

          test -f "$shared_env"
          grep -qx "DEPLOY_ENV=$DEPLOY_ENV" "$shared_env"
          case "$FORCE_ACTIVATE" in 0|1) ;; *) exit 1 ;; esac

          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          rm -f "$archive"
          ln -sfn "$shared_env" "$release_dir/deploy/vps/.env"

          if [[ -f "$RUNTIME_PATH/active-environment" ]]; then
            active_environment="$(<"$RUNTIME_PATH/active-environment")"
          fi

          if [[ "$FORCE_ACTIVATE" == "1" || "$active_environment" == "$DEPLOY_ENV" ]]; then
            if ! DEPLOY_MODE=activate RELEASE_SHA="$RELEASE_SHA" bash "$release_dir/deploy/vps/deploy.sh"; then
              if [[ -n "$previous_release" && -d "$previous_release/deploy/vps" ]]; then
                DEPLOY_MODE=activate RELEASE_SHA="$(basename "$previous_release")" bash "$previous_release/deploy/vps/deploy.sh" || true
              fi
              exit 1
            fi
          else
            DEPLOY_MODE=stage RELEASE_SHA="$RELEASE_SHA" bash "$release_dir/deploy/vps/deploy.sh"
          fi

          ln -sfn "$release_dir" "$current_link"

          find "$environment_root/releases" \
            -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr | tail -n +4 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE

      - name: Publish VPS deployment status
        if: always() && steps.release.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          set -Eeuo pipefail
          description="bot ${DEPLOY_ENV} VPS deployment failed"
          if [[ "$DEPLOY_STATE" == "success" ]]; then
            description="bot ${DEPLOY_ENV} VPS deployment is healthy"
          fi
          payload="$(jq -nc \
            --arg state "$DEPLOY_STATE" \
            --arg context "deploy/vps-bot-${DEPLOY_ENV}" \
            --arg description "$description" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data "$payload"
