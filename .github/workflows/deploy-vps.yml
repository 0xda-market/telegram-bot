name: Deploy Bot to VPS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vps-bot-development
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
    env:
      DEPLOY_ENV: development
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: 22022
      VPS_DEPLOY_PATH: ${{ vars.VPS_BOT_DEPLOY_PATH || '/opt/0xda-market-bot' }}
      VPS_RUNTIME_PATH: /opt/0xda-market-runtime
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Validate deployment configuration
        run: |
          set -Eeuo pipefail
          test "$DEPLOY_ENV" = development
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not configured for the development environment"
              missing=1
            fi
          done
          test "$missing" -eq 0
          test -n "$VPS_DEPLOY_PATH"
          test -n "$RELEASE_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >>"$HOME/.ssh/known_hosts"

      - name: Upload build
        run: |
          set -Eeuo pipefail
          archive="/tmp/0xda-market-bot-${DEPLOY_ENV}-${RELEASE_SHA}.tar.gz"
          tar --exclude=.git --exclude='deploy/vps/.env' -czf "$archive" .
          scp -P "$SSH_PORT" "$archive" "$SSH_USER@$SSH_HOST:/tmp/"

      - name: Stage or refresh environment
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$VPS_DEPLOY_PATH' RUNTIME_PATH='$VPS_RUNTIME_PATH' DEPLOY_ENV='$DEPLOY_ENV' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          environment_root="$DEPLOY_PATH/environments/$DEPLOY_ENV"
          archive="/tmp/0xda-market-bot-${DEPLOY_ENV}-${RELEASE_SHA}.tar.gz"
          release_dir="$environment_root/releases/$RELEASE_SHA"
          shared_env="$environment_root/shared/.env"
          current_link="$environment_root/current"
          active_environment=""
          previous_release="$(readlink -f "$current_link" 2>/dev/null || true)"

          test -f "$shared_env"
          grep -qx "DEPLOY_ENV=$DEPLOY_ENV" "$shared_env"

          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          rm -f "$archive"
          ln -sfn "$shared_env" "$release_dir/deploy/vps/.env"

          if [[ -f "$RUNTIME_PATH/active-environment" ]]; then
            active_environment="$(<"$RUNTIME_PATH/active-environment")"
          fi

          if [[ "$active_environment" == "$DEPLOY_ENV" ]]; then
            if ! DEPLOY_MODE=activate bash "$release_dir/deploy/vps/deploy.sh"; then
              if [[ -n "$previous_release" && -d "$previous_release/deploy/vps" ]]; then
                DEPLOY_MODE=activate bash "$previous_release/deploy/vps/deploy.sh" || true
              fi
              exit 1
            fi
          else
            DEPLOY_MODE=stage bash "$release_dir/deploy/vps/deploy.sh"
          fi

          ln -sfn "$release_dir" "$current_link"

          find "$environment_root/releases" \
            -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr | tail -n +4 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE

      - name: Publish VPS deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          set -Eeuo pipefail
          description="bot VPS deployment failed"
          if [[ "$DEPLOY_STATE" == "success" ]]; then
            description="bot VPS deployment is healthy"
          fi
          payload="$(jq -nc \
            --arg state "$DEPLOY_STATE" \
            --arg context "deploy/vps-bot-development" \
            --arg description "$description" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data "$payload"
