name: Deploy development via infra

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: market-bot-development-deploy
  cancel-in-progress: false

jobs:
  package:
    name: Verify master CI and publish an immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Require master and successful exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/master || {
            echo "::error::Development deploy must run from master." >&2
            exit 1
          }
          runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=30")"
          jq -e --arg sha "$GITHUB_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha
              and .head_branch == "master"
              and .status == "completed"
              and .conclusion == "success")] | length > 0
          ' <<<"$runs" >/dev/null || {
            echo "::error::A successful push-triggered Full CI run for this exact master SHA is required." >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log into producer-owned GHCR package
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/0xda-market/telegram-bot:development-${{ github.sha }}

      - name: Export immutable digest
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "ref=ghcr.io/0xda-market/telegram-bot@$DIGEST" >> "$GITHUB_OUTPUT"

  request:
    name: Request development activation through infra
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
    env:
      INFRA_REPOSITORY: aiaiaiai-org/infra
      WORKLOAD: market-bot-test
      IMAGE_REF: ${{ needs.package.outputs.image }}
    steps:
      - name: Validate development settings without disclosing credentials
        env:
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          MARKET_API_URL: ${{ vars.MARKET_API_URL }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/master
          [[ "$IMAGE_REF" =~ ^ghcr[.]io/0xda-market/telegram-bot@sha256:[0-9a-f]{64}$ ]]
          [[ "$TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z0-9_]{5,32}$ ]] || {
            echo "::error::TELEGRAM_BOT_USERNAME must be a username without @ or t.me URL." >&2
            exit 1
          }
          test "$PUBLIC_URL" = "https://0xda-market.nilx.one/bot-test" || {
            echo "::error::PUBLIC_URL must point to the test bot, not production." >&2
            exit 1
          }
          [[ "$MARKET_API_URL" =~ ^http://market-api-development:10000/?$ ]] || {
            echo "::error::MARKET_API_URL must be the development Core endpoint." >&2
            exit 1
          }

      - name: Obtain target server public encryption recipient
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || {
            echo "::error::INFRA_DEPLOY_TOKEN is unavailable to telegram-bot." >&2
            exit 1
          }
          workflow="issue-workload-recipient.yml"
          runs_endpoint="repos/$INFRA_REPOSITORY/actions/workflows/$workflow/runs"
          baseline="$(gh api --method GET \
            "$runs_endpoint?event=repository_dispatch&per_page=1" \
            --jq '.workflow_runs[0].id // 0')"
          [[ "$baseline" =~ ^[0-9]+$ ]]
          jq -nc --arg workload "$WORKLOAD" --arg request_id "$GITHUB_RUN_ID" \
            '{event_type: "issue-workload-recipient", client_payload:
              {workload: $workload, request_id: $request_id}}' |
            gh api --method POST "repos/$INFRA_REPOSITORY/dispatches" --input -

          title="Recipient $WORKLOAD / $GITHUB_RUN_ID"
          recipient_run=""
          status=""
          conclusion=""
          for attempt in $(seq 1 36); do
            response="$(gh api --method GET "$runs_endpoint?event=repository_dispatch&per_page=100")"
            matched="$(jq -c --arg title "$title" --argjson baseline "$baseline" '
              [.workflow_runs[] | select(.id > $baseline
                and .display_title == $title
                and .head_branch == "master")] | sort_by(.id) | last // empty
            ' <<<"$response")"
            if [[ -n "$matched" ]]; then
              recipient_run="$(jq -r .id <<<"$matched")"
              status="$(jq -r .status <<<"$matched")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$matched")"
              if [[ "$status" == completed ]]; then
                test "$conclusion" = success || {
                  echo "::error::Infra recipient issuance failed." >&2
                  exit 1
                }
                break
              fi
            fi
            sleep 10
          done
          test -n "$recipient_run" && test "$status" = completed && test "$conclusion" = success || {
            echo "::error::Timed out waiting for matching infra recipient." >&2
            exit 1
          }

          recipient_dir="$RUNNER_TEMP/market-bot-recipient"
          install -d -m 0700 "$recipient_dir"
          gh run download "$recipient_run" --repo "$INFRA_REPOSITORY" \
            --name "recipient-$WORKLOAD-$GITHUB_RUN_ID" --dir "$recipient_dir"
          recipient_path="$recipient_dir/recipient.pub"
          test -s "$recipient_path"
          test "$(wc -l < "$recipient_path")" -eq 1
          grep -Eq '^ssh-(ed25519|rsa) [A-Za-z0-9+/=]+( .*)?$' "$recipient_path"
          ssh-keygen -lf "$recipient_path" >/dev/null
          echo "INFRA_RECIPIENT_PATH=$recipient_path" >> "$GITHUB_ENV"

      - name: Encrypt producer credentials and dispatch the immutable image
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          INFRA_RECIPIENT_PATH: ${{ env.INFRA_RECIPIENT_PATH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          MARKET_API_URL: ${{ vars.MARKET_API_URL }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$GH_TOKEN"
          test -s "$INFRA_RECIPIENT_PATH"
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET MARKET_API_TOKEN \
                      TELEGRAM_BOT_USERNAME PUBLIC_URL MARKET_API_URL; do
            value="$(printenv "$name")"
            test -n "$value" || {
              echo "::error::Missing development credential/configuration $name." >&2
              exit 1
            }
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
              echo "::error::Invalid multiline value for $name." >&2
              exit 1
            }
          done
          [[ "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{1,256}$ ]] || {
            echo "::error::Telegram webhook secret must use the Telegram secret_token alphabet." >&2
            exit 1
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

          source_file="$RUNNER_TEMP/market-bot-source.env"
          encrypted_file="$RUNNER_TEMP/market-bot-source.age"
          trap 'rm -f "$source_file" "$encrypted_file"; rm -rf "$RUNNER_TEMP/market-bot-recipient"' EXIT
          {
            for name in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET MARKET_API_TOKEN \
                        TELEGRAM_BOT_USERNAME PUBLIC_URL MARKET_API_URL; do
              printf '%s=%s\n' "$name" "$(printenv "$name")"
            done
          } > "$source_file"

          age --armor --recipient "$(cat "$INFRA_RECIPIENT_PATH")" \
            --output "$encrypted_file" "$source_file"
          rm -f "$source_file"

          jq -nc --arg workload "$WORKLOAD" --arg image "$IMAGE_REF" \
            --rawfile secrets_age "$encrypted_file" \
            '{event_type: "deploy-workload", client_payload: {
              workload: $workload, image: $image, secrets_age: $secrets_age
            }}' | gh api --method POST "repos/$INFRA_REPOSITORY/dispatches" --input -

          {
            echo "### Test Telegram Bot deployment request"
            echo
            echo "- Source commit: $GITHUB_SHA"
            echo "- Image digest: $IMAGE_REF"
            echo "- Target workload: $WORKLOAD"
            echo "- Encrypted request submitted to $INFRA_REPOSITORY"
            echo "- This step does not confirm activation; inspect infra's Deploy workload run."
          } >> "$GITHUB_STEP_SUMMARY"
