name: CI

on:
  push:
    branches:
      - master
      - 'release*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository CI
        id: tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash bin/ci
      - name: Upload test failure log
        if: failure() && hashFiles('test.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 3
