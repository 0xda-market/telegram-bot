name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: telegram-bot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository CI
        id: tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash bin/ci
      - name: Upload test failure log
        if: failure() && hashFiles('test.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 3

  # Automatic development delivery of market-bot-test (aiaiaiai-org/infra
  # docs/automatic-delivery.md). Runs only for a master push whose CI passed.
  # Infra verifies both attestations against this workflow, branch and commit;
  # this repository holds no infra credential.
  publish-development:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/0xda-market/telegram-bot
    steps:
      - name: Validate development configuration
        env:
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          MARKET_API_URL: ${{ vars.MARKET_API_URL }}
        run: |
          set -Eeuo pipefail
          [[ "$TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z0-9_]{5,32}$ ]] || {
            echo "::error::TELEGRAM_BOT_USERNAME must be a username without @ or t.me URL." >&2
            exit 1
          }
          test "$PUBLIC_URL" = "https://0xda-market.nilx.one/bot-test" || {
            echo "::error::PUBLIC_URL must point to the test bot, not production." >&2
            exit 1
          }
          [[ "$MARKET_API_URL" =~ ^http://market-api-development:10000/?$ ]] || {
            echo "::error::MARKET_API_URL must be the development Core endpoint." >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the commit image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Attest the commit image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Encrypt credentials to the edge-prod-1 recipient
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
          TRADING_LAB_TOKEN: ${{ secrets.TRADING_LAB_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          MARKET_API_URL: ${{ vars.MARKET_API_URL }}
        run: |
          set -Eeuo pipefail
          umask 077
          # Exactly the names the market-bot-test contract maps: secrets plus producerEnvironment.
          names=(TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET MARKET_API_TOKEN TRADING_LAB_TOKEN
                 TELEGRAM_BOT_USERNAME PUBLIC_URL MARKET_API_URL)
          for name in "${names[@]}"; do
            value="$(printenv "$name")"
            test -n "$value" || { echo "::error::Missing development credential/configuration $name." >&2; exit 1; }
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo "::error::Invalid multiline value for $name." >&2; exit 1; }
          done
          [[ "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{1,256}$ ]] || {
            echo "::error::Telegram webhook secret must use the Telegram secret_token alphabet." >&2
            exit 1
          }
          contract="$(curl -fsSL https://raw.githubusercontent.com/aiaiaiai-org/infra/master/contracts/servers/edge-prod-1.yaml)"
          recipient="$(sed -n 's/^  encryptionRecipient: //p' <<<"$contract")"
          [[ "$recipient" =~ ^ssh-ed25519\ [A-Za-z0-9+/]{68}$ ]] || {
            echo "::error::edge-prod-1 publishes no valid encryptionRecipient." >&2
            exit 1
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          mkdir -p "$RUNNER_TEMP/envelope"
          for name in "${names[@]}"; do printf '%s=%s\n' "$name" "$(printenv "$name")"; done |
            age --recipient "$recipient" --output "$RUNNER_TEMP/envelope/secrets.age"
          test -s "$RUNNER_TEMP/envelope/secrets.age"
          printf 'FROM scratch\nCOPY secrets.age /secrets.age\n' > "$RUNNER_TEMP/envelope/Dockerfile"
          echo "ENVELOPE_CONTEXT=$RUNNER_TEMP/envelope" >> "$GITHUB_ENV"

      - name: Publish the secret envelope
        id: envelope
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ENVELOPE_CONTEXT }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}.secrets

      - name: Attest the secret envelope
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.envelope.outputs.digest }}
          push-to-registry: true
