name: CI

on:
  push:
    branches:
      - master
      - 'release*'
  pull_request:

permissions:
  contents: write

jobs:
  refine_namespace:
    if: github.head_ref == 'refactor/telegram-bot-namespace' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/telegram-bot-namespace
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          bundler-cache: true

      - name: Move Telegram bot under market namespace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib/zero_x_da/market
          git mv lib/zero_x_da/telegram_bot lib/zero_x_da/market/telegram_bot

          mapfile -d '' files < <(git grep -Ilz -e 'zero_x_da/telegram_bot' -e 'ZeroXDA::TelegramBot' || true)
          if ((${#files[@]})); then
            perl -pi -e 's#zero_x_da/telegram_bot#zero_x_da/market/telegram_bot#g; s/ZeroXDA::TelegramBot/ZeroXDA::Market::TelegramBot/g' "${files[@]}"
          fi

          python3 - <<'PY'
          from pathlib import Path

          for path in Path('lib/zero_x_da/market/telegram_bot').glob('*.rb'):
              text = path.read_text()
              old = 'module ZeroXDA\n  module TelegramBot\n'
              new = 'module ZeroXDA\n  module Market\n    module TelegramBot\n'
              if old not in text:
                  raise SystemExit(f'expected namespace declaration missing: {path}')
              text = text.replace(old, new, 1)
              text = text.rstrip() + '\n  end\nend\n'
              path.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('`ZeroXDA::TelegramBot`', '`ZeroXDA::Market::TelegramBot`')
          text = text.replace('`lib/zero_x_da/telegram_bot/`', '`lib/zero_x_da/market/telegram_bot/`')
          readme.write_text(text)
          PY

          git checkout origin/master -- .github/workflows/ci.yml
          rm -f .github/workflows/refine-market-namespace.yml

          if git grep -n -e 'zero_x_da/telegram_bot' -e 'ZeroXDA::TelegramBot'; then
            echo 'Intermediate namespace references remain.' >&2
            exit 1
          fi

      - name: Verify refactor
        run: bundle exec rake

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refine Telegram bot market namespace"
          git push origin HEAD:refactor/telegram-bot-namespace

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
      - run: bundle install
      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          bundle exec rake >test.log 2>&1 || {
            cat test.log
            exit 1
          }
      - name: Validate documented repository links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash bin/check_documented_repositories
      - name: Upload test failure log
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 3
      - name: Validate VPS deployment configuration
        run: |
          bash -n bin/check_documented_repositories
          bash -n deploy/vps/deploy.sh
          bash -n deploy/vps/run-price-digest.sh
          bash -n deploy/vps/install-systemd.sh
          bash test/vps_price_digest_test.sh
          cat >deploy/vps/.env <<'ENV'
          DEPLOY_ENV=development
          ENV
          docker compose --file deploy/vps/compose.yaml --env-file deploy/vps/.env config --quiet
      - run: docker build --tag 0xda-market-bot .
