name: Refactor README cleanup

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'refactor/telegram-bot-namespace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/telegram-bot-namespace
          fetch-depth: 0

      - name: Align README with persistent runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = (
              "Market API calls retry temporary `502`, `503`, `504`, transport failures and\n"
              "transient non-JSON responses with exponential backoff. Slow commands may send a\n"
              "localized server-starting notice while the core becomes available."
          )
          new = (
              "Market API calls retry temporary `502`, `503`, `504`, transport failures and\n"
              "transient non-JSON responses with exponential backoff. The VPS bot is a persistent\n"
              "runtime, so upstream latency is reported through the normal result or error path\n"
              "and is never described as the server starting."
          )
          if old not in text:
              raise SystemExit('expected README runtime paragraph was not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/refactor-readme-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: align Telegram bot runtime terminology"
          git push origin HEAD:refactor/telegram-bot-namespace
